<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soundboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #1e1e1e;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .soundboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sound-button {
            min-height: 90px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;

            transition:
                background 0.15s,
                transform 0.1s;
        }

        .sound-button:hover {
            background: #4a4a4a;
        }

        .sound-button:active {
            transform: scale(0.95);
            background: #666;
        }

        .sound-button.playing {
            background: #0078d4;
        }

        .sound-icon {
            font-size: 22px;
        }

        .instructions {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <h1>🔊 Soundboard</h1>

    <div class="instructions">
        Click a button to play or stop a sound.
    </div>

    <div id="soundboard" class="soundboard"></div>


    <script>

        /*
         * ============================================================
         * AUDIO FILES
         * ============================================================
         *
         * Put your MP3/WAV files inside:
         *
         *     AUDIO_SAMPLES/
         *
         * Then add the filenames below.
         *
         */

        const audioFiles = [
            "laugh.mp3",
            "fahhhhh.mp3",
            "wild_geese.wav",
            "crowd_laugh.wav",
            "sad_trombone.wav",
            "applause.wav",
            "Ew_brother.mp3",
            "yeah_buddy.mp3",
            "goofy_slip.wav",
            "OMG.wav",
            "bruh.wav",
            "alert.wav",
            "slam.wav",
            "organ.mp3",
            "taco-bong.mp3",
            "airhorn.mp3",
            "among-us.mp3",
            "buzzer.mp3",
            "chalo.mp3",
            "correct.mp3",
            "dexter.mp3",
            "dj-stop.mp3",
            "dun-dun.mp3",
            "emotional.mp3",
            "few-moments.mp3",
            "heaven.mp3",
            "huh.mp3",
            "japan.mp3",
            "meme.mp3",
            "money.mp3",
            "notification.mp3",
            "organ.mp3",
            "punch.mp3",
            "quack.mp3",
            "rizz.mp3",
            "wow.mp3"
            
        ];


        /*
         * ============================================================
         * CREATE SOUND BUTTONS
         * ============================================================
         */

        const soundboard = document.getElementById("soundboard");

        audioFiles.forEach((fileName, index) => {

            // Create the button
            const button = document.createElement("button");
            button.className = "sound-button";

            // Remove the extension for the button label
            const buttonName = fileName
                .replace(/\.[^/.]+$/, "")
                .replace(/[_-]/g, " ");

            // Capitalize the first letter
            const displayName =
                buttonName.charAt(0).toUpperCase() +
                buttonName.slice(1);

            // Create HTML structure with an icon container and text label
            const iconSpan = document.createElement("span");
            iconSpan.className = "sound-icon";
            iconSpan.textContent = "▶"; // Default to Play icon

            const textSpan = document.createElement("span");
            textSpan.textContent = displayName;

            button.appendChild(iconSpan);
            button.appendChild(textSpan);


            /*
             * Create the audio object
             */
            const audio = new Audio(
                "AUDIO_SAMPLES/" + fileName
            );


            /*
             * Toggle play / stop when the button is clicked
             */
            button.addEventListener("click", () => {

                if (!audio.paused) {
                    // If it is currently playing, stop it
                    audio.pause();
                    audio.currentTime = 0;
                    button.classList.remove("playing");
                    iconSpan.textContent = "▶";
                } else {
                    // If it is stopped, play it
                    audio.currentTime = 0;
                    audio.play()
                        .then(() => {
                            button.classList.add("playing");
                            iconSpan.textContent = "⏹"; // Switch to Stop icon
                        })
                        .catch(error => {
                            console.error(
                                "Unable to play " + fileName,
                                error
                            );
                        });
                }
            });


            /*
             * Reset the icon and appearance when the sound finishes naturally
             */
            audio.addEventListener("ended", () => {
                button.classList.remove("playing");
                iconSpan.textContent = "▶";
            });


            /*
             * Add button to the page
             */
            soundboard.appendChild(button);

        });

    </script>

</body>
</html>
