<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Soundboard</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 30px;
            background: #1e1e1e;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .soundboard {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sound-button {
            min-height: 90px;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #333;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s;
        }

        .sound-button:hover {
            background: #4a4a4a;
        }

        .sound-button:active {
            transform: scale(0.95);
            background: #666;
        }

        .sound-button.playing {
            background: #0078d4;
        }

        .instructions {
            text-align: center;
            color: #aaa;
            margin-bottom: 25px;
        }
    </style>
</head>

<body>

    <h1>🔊 Soundboard</h1>

    <div class="instructions">
        Click a button to play a sound.
    </div>

    <div id="soundboard" class="soundboard"></div>


    <script>

        /*
         * ============================================================
         * AUDIO FILES
         * ============================================================
         *
         * Put your MP3/WAV files inside:
         *
         *     AUDIO_SAMPLES/
         *
         * Then add the filenames below.
         *
         * Example:
         *
         * "applause.mp3"
         * "laugh.wav",
         *
         */

        const audioFiles = [
            "laugh.mp3",
			"fahhhhh.mp3",
			"wild_geese.wav",
			"crowd_laugh.wav",
			"sad_trombone.wav",
			"applause.wav"
        ];


        /*
         * ============================================================
         * CREATE SOUND BUTTONS
         * ============================================================
         */

        const soundboard = document.getElementById("soundboard");

        audioFiles.forEach((fileName, index) => {

            // Create the button
            const button = document.createElement("button");

            button.className = "sound-button";

            // Remove the extension for the button label
            const buttonName = fileName
                .replace(/\.[^/.]+$/, "")
                .replace(/[_-]/g, " ");

            // Capitalize the first letter
            const displayName =
                buttonName.charAt(0).toUpperCase() +
                buttonName.slice(1);

            button.textContent = displayName;


            /*
             * Create the audio object
             */
            const audio = new Audio(
                "AUDIO_SAMPLES/" + fileName
            );


            /*
             * Play the sound when the button is clicked
             */
            button.addEventListener("click", () => {

                // Restart the sound if it is already playing
                audio.currentTime = 0;

                audio.play()
                    .then(() => {
                        button.classList.add("playing");
                    })
                    .catch(error => {
                        console.error(
                            "Unable to play " + fileName,
                            error
                        );
                    });
            });


            /*
             * Remove the "playing" appearance
             * when the sound finishes.
             */
            audio.addEventListener("ended", () => {
                button.classList.remove("playing");
            });


            /*
             * Add button to the page
             */
            soundboard.appendChild(button);

        });

    </script>

</body>
</html>
