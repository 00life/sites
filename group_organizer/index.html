<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <h1>Group Organizer</h1>

    <p>
        Create balanced student groups based on grades
    </p>

</header>


<div class="container">


    <!-- =========================
         INPUT SECTION
    ========================= -->

    <div class="input-section">

        <div class="columns">


            <!-- STUDENT NAMES -->

            <div class="input-group">

                <label for="studentNames">
                    Student Names
                </label>

                <textarea
                    id="studentNames"
                    placeholder="Enter one student per line:

Alice
Bob
Charlie
David
Emma
Frank"></textarea>

            </div>



            <!-- STUDENT GRADES -->

            <div class="input-group">

                <label for="studentGrades">
                    Student Grades
                </label>

                <textarea
                    id="studentGrades"
                    placeholder="Enter one grade per line.

Missing grades will automatically be assigned 0.

85
92

88
95
81"></textarea>

            </div>



            <!-- GROUP CONTROLS -->

            <div class="controls">

                <label for="numberOfGroups">
                    Number of Groups
                </label>

                <input
                    type="number"
                    id="numberOfGroups"
                    min="1"
                    value="2">

                <button
                    onclick="organizeGroups()">

                    Organize Groups

                </button>

            </div>


        </div>


        <div id="errorMessage"></div>

    </div>



    <!-- =========================
         RESULTS
    ========================= -->

    <div id="results"></div>


</div>



<script>

    /* =====================================================
       ORGANIZE GROUPS
    ===================================================== */

    function organizeGroups() {


        // Clear previous results
        document.getElementById(
            "errorMessage"
        ).textContent = "";

        document.getElementById(
            "results"
        ).innerHTML = "";


        // Get names
        const namesText =
            document.getElementById(
                "studentNames"
            ).value.trim();


        // Get grades
        const gradesText =
            document.getElementById(
                "studentGrades"
            ).value.trim();


        // Get number of groups
        const numberOfGroups =
            parseInt(
                document.getElementById(
                    "numberOfGroups"
                ).value
            );


        /* =================================================
           VALIDATE STUDENT NAMES
        ================================================= */

        if (!namesText) {

            showError(
                "Please enter the student names."
            );

            return;
        }


        /* =================================================
           GET NAMES
        ================================================= */

        const names =
            namesText
                .split("\n")
                .map(
                    name =>
                        name.trim()
                )
                .filter(
                    name =>
                        name !== ""
                );


        /* =================================================
           GET GRADES

           Important:
           We DO NOT require the number of grades
           to match the number of students.

           Missing grades become 0.
        ================================================= */

        const grades =
            gradesText
                ? gradesText
                    .split("\n")
                    .map(
                        grade =>
                            grade.trim()
                    )
                : [];


        /* =================================================
           VALIDATE NUMBER OF GROUPS
        ================================================= */

        if (
            isNaN(numberOfGroups) ||
            numberOfGroups < 1
        ) {

            showError(
                "Please enter a valid number of groups."
            );

            return;
        }


        /* =================================================
           MAKE SURE THERE ARE NOT MORE GROUPS
           THAN STUDENTS
        ================================================= */

        if (
            numberOfGroups >
            names.length
        ) {

            showError(
                "The number of groups cannot be greater than the number of students."
            );

            return;
        }


        /* =================================================
           CREATE STUDENT OBJECTS
        ================================================= */

        const students = [];


        for (
            let i = 0;
            i < names.length;
            i++
        ) {


            let grade = 0;

            let missing = true;


            /*
                Check whether a grade exists
                for this student.
            */

            if (
                grades[i] !== undefined &&
                grades[i] !== ""
            ) {

                const parsedGrade =
                    parseFloat(
                        grades[i]
                    );


                /*
                    If it is a valid number,
                    use it.
                */

                if (
                    !isNaN(parsedGrade)
                ) {

                    grade =
                        parsedGrade;

                    missing = false;
                }

            }


            /*
                Store student information.
            */

            students.push({

                name:
                    names[i],

                grade:
                    grade,

                missing:
                    missing

            });

        }


        /* =================================================
           SORT STUDENTS

           Highest grades first.

           Missing grades (0) naturally go
           to the bottom.
        ================================================= */

        students.sort(
            (a, b) =>
                b.grade -
                a.grade
        );


        /* =================================================
           CREATE EMPTY GROUPS
        ================================================= */

        const groups = [];


        for (
            let i = 0;
            i < numberOfGroups;
            i++
        ) {

            groups.push({

                students: [],

                total: 0

            });

        }


        /* =================================================
           CALCULATE MAXIMUM GROUP SIZE

           Example:

           20 students / 4 groups
           = 5 per group

           22 students / 4 groups
           = groups can contain 5 or 6
        ================================================= */

        const maximumGroupSize =
            Math.ceil(
                students.length /
                numberOfGroups
            );


        /* =================================================
           BALANCE STUDENTS

           Each student is placed into the group
           with the lowest current grade total.

           This attempts to keep the total grades
           as balanced as possible.
        ================================================= */

        students.forEach(
            student => {


                /*
                    Find groups that have not
                    reached their maximum size.
                */

                const availableGroups =
                    groups.filter(
                        group =>
                            group.students
                                .length <
                            maximumGroupSize
                    );


                /*
                    Sort groups by their
                    current grade total.

                    The group with the lowest
                    total comes first.

                    If totals are equal,
                    choose the group with
                    fewer students.
                */

                availableGroups.sort(
                    (a, b) => {

                        if (
                            a.total ===
                            b.total
                        ) {

                            return (
                                a.students.length -
                                b.students.length
                            );

                        }


                        return (
                            a.total -
                            b.total
                        );

                    }
                );


                /*
                    Select the group with
                    the lowest total.
                */

                const chosenGroup =
                    availableGroups[0];


                /*
                    Add student.
                */

                chosenGroup.students.push(
                    student
                );


                /*
                    Add grade to group total.

                    Missing grades are already
                    represented as 0.
                */

                chosenGroup.total +=
                    student.grade;

            }
        );


        /* =================================================
           DISPLAY RESULTS
        ================================================= */

        displayGroups(groups);

    }



    /* =====================================================
       DISPLAY GROUPS
    ===================================================== */

    function displayGroups(groups) {


        const results =
            document.getElementById(
                "results"
            );


        let html = `

            <h2 class="results-title">
                Organized Groups
            </h2>

            <div class="groups-container">

        `;


        let totalClassGrade = 0;

        let totalStudents = 0;


        /* =================================================
           CREATE EACH GROUP
        ================================================= */

        groups.forEach(
            (group, index) => {


                const average =
                    group.students.length > 0
                        ? group.total /
                          group.students.length
                        : 0;


                totalClassGrade +=
                    group.total;


                totalStudents +=
                    group.students.length;


                html += `

                    <div class="group-card">

                        <div class="group-header">

                            <h3>
                                Group ${index + 1}
                            </h3>

                        </div>


                        <ul class="student-list">

                `;


                /* =========================================
                   ADD STUDENTS
                ========================================= */

                group.students.forEach(
                    student => {


                        /*
                            Display missing grades
                            differently.
                        */

                        let gradeDisplay;


                        if (
                            student.missing
                        ) {

                            gradeDisplay = `

                                <span class="missing-grade">
                                    0 (Missing)
                                </span>

                            `;

                        } else {

                            gradeDisplay = `

                                <span class="student-grade">
                                    ${student.grade}
                                </span>

                            `;

                        }


                        html += `

                            <li>

                                <span>
                                    ${escapeHTML(
                                        student.name
                                    )}
                                </span>

                                ${gradeDisplay}

                            </li>

                        `;

                    }
                );


                html += `

                        </ul>


                        <div class="group-stats">

                            <div>

                                <strong>
                                    Students:
                                </strong>

                                ${group.students.length}

                            </div>


                            <div>

                                <strong>
                                    Average Grade:
                                </strong>

                                ${average.toFixed(2)}

                            </div>

                        </div>

                    </div>

                `;

            }
        );


        html += `

            </div>

        `;


        /* =================================================
           OVERALL CLASS AVERAGE
        ================================================= */

        const classAverage =
            totalStudents > 0
                ? totalClassGrade /
                  totalStudents
                : 0;


        html += `

            <div class="overall-summary">

                <strong>
                    Class Average:
                </strong>

                ${classAverage.toFixed(2)}

                &nbsp;&nbsp; | &nbsp;&nbsp;

                <strong>
                    Total Students:
                </strong>

                ${totalStudents}

                &nbsp;&nbsp; | &nbsp;&nbsp;

                <strong>
                    Number of Groups:
                </strong>

                ${groups.length}

            </div>

        `;


        results.innerHTML =
            html;

    }



    /* =====================================================
       DISPLAY ERROR
    ===================================================== */

    function showError(message) {

        document.getElementById(
            "errorMessage"
        ).textContent =
            message;

    }



    /* =====================================================
       ESCAPE HTML

       Protects the page if a student name
       contains HTML characters.
    ===================================================== */

    function escapeHTML(text) {

        const div =
            document.createElement(
                "div"
            );


        div.textContent =
            text;


        return div.innerHTML;

    }

</script>


</body>
</html>
