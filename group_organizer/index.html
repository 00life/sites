<body>

<header>
    <h1>Group Organizer</h1>
    <p>Create balanced student groups based on grades</p>
</header>

<div class="container">

    <div class="input-section">

        <div class="columns">

            <!-- Student Names -->
            <div class="input-group">

                <label for="studentNames">
                    Student Names
                </label>

                <textarea
                    id="studentNames"
                    placeholder="Enter one student per line:

Alice
Bob
Charlie
David
Emma
Frank"></textarea>

            </div>


            <!-- Student Grades -->
            <div class="input-group">

                <label for="studentGrades">
                    Student Grades
                </label>

                <textarea
                    id="studentGrades"
                    placeholder="Enter one grade per line:

85
92
76
88
95
81"></textarea>

            </div>


            <!-- Group Controls -->
            <div class="controls">

                <label for="numberOfGroups">
                    Number of Groups
                </label>

                <input
                    type="number"
                    id="numberOfGroups"
                    min="1"
                    value="2">

                <button onclick="organizeGroups()">
                    Organize Groups
                </button>

            </div>

        </div>

        <div id="errorMessage"></div>

    </div>


    <!-- Results -->
    <div id="results"></div>

</div>


<script>

    function organizeGroups() {

        document.getElementById("errorMessage").textContent = "";
        document.getElementById("results").innerHTML = "";

        const namesText =
            document.getElementById("studentNames").value.trim();

        const gradesText =
            document.getElementById("studentGrades").value.trim();

        const numberOfGroups =
            parseInt(
                document.getElementById("numberOfGroups").value
            );


        if (!namesText || !gradesText) {

            showError(
                "Please enter both student names and grades."
            );

            return;
        }


        const names = namesText
            .split("\n")
            .map(name => name.trim())
            .filter(name => name !== "");


        const grades = gradesText
            .split("\n")
            .map(grade => grade.trim())
            .filter(grade => grade !== "");


        if (names.length !== grades.length) {

            showError(
                "The number of student names must match the number of grades."
            );

            return;
        }


        if (
            isNaN(numberOfGroups) ||
            numberOfGroups < 1
        ) {

            showError(
                "Please enter a valid number of groups."
            );

            return;
        }


        if (numberOfGroups > names.length) {

            showError(
                "The number of groups cannot be greater than the number of students."
            );

            return;
        }


        const students = [];


        for (let i = 0; i < names.length; i++) {

            const grade = parseFloat(grades[i]);


            if (isNaN(grade)) {

                showError(
                    "All grades must be valid numbers."
                );

                return;
            }


            students.push({
                name: names[i],
                grade: grade
            });
        }


        /*
            Sort students from highest grade
            to lowest grade.
        */

        students.sort(
            (a, b) => b.grade - a.grade
        );


        /*
            Create groups.
        */

        const groups = [];


        for (let i = 0; i < numberOfGroups; i++) {

            groups.push({
                students: [],
                total: 0
            });
        }


        /*
            Keep group sizes as even as possible.
        */

        const maximumGroupSize =
            Math.ceil(
                students.length / numberOfGroups
            );


        /*
            Balance grades by placing each
            student into the group with
            the lowest current total.
        */

        students.forEach(student => {

            const availableGroups =
                groups.filter(
                    group =>
                        group.students.length <
                        maximumGroupSize
                );


            availableGroups.sort(
                (a, b) => {

                    if (a.total === b.total) {

                        return (
                            a.students.length -
                            b.students.length
                        );
                    }

                    return a.total - b.total;
                }
            );


            const chosenGroup =
                availableGroups[0];


            chosenGroup.students.push(student);

            chosenGroup.total += student.grade;

        });


        displayGroups(groups);

    }


    function displayGroups(groups) {

        const results =
            document.getElementById("results");


        let html = `
            <h2 class="results-title">
                Organized Groups
            </h2>

            <div class="groups-container">
        `;


        let totalClassGrade = 0;
        let totalStudents = 0;


        groups.forEach((group, index) => {

            const average =
                group.students.length > 0
                    ? group.total /
                      group.students.length
                    : 0;


            totalClassGrade += group.total;

            totalStudents +=
                group.students.length;


            html += `

                <div class="group-card">

                    <div class="group-header">

                        <h3>
                            Group ${index + 1}
                        </h3>

                    </div>


                    <ul class="student-list">
            `;


            group.students.forEach(student => {

                html += `

                    <li>

                        <span>
                            ${escapeHTML(student.name)}
                        </span>

                        <span class="student-grade">
                            ${student.grade}
                        </span>

                    </li>

                `;

            });


            html += `

                    </ul>


                    <div class="group-stats">

                        <div>
                            <strong>Students:</strong>
                            ${group.students.length}
                        </div>

                        <div>
                            <strong>Average Grade:</strong>
                            ${average.toFixed(2)}
                        </div>

                    </div>

                </div>

            `;

        });


        html += `
            </div>
        `;


        const classAverage =
            totalStudents > 0
                ? totalClassGrade / totalStudents
                : 0;


        html += `

            <div class="overall-summary">

                <strong>Class Average:</strong>
                ${classAverage.toFixed(2)}

                &nbsp;&nbsp; | &nbsp;&nbsp;

                <strong>Total Students:</strong>
                ${totalStudents}

                &nbsp;&nbsp; | &nbsp;&nbsp;

                <strong>Number of Groups:</strong>
                ${groups.length}

            </div>

        `;


        results.innerHTML = html;

    }


    function showError(message) {

        document.getElementById(
            "errorMessage"
        ).textContent = message;

    }


    function escapeHTML(text) {

        const div =
            document.createElement("div");

        div.textContent = text;

        return div.innerHTML;

    }

</script>

</body>
</html>
